# Perfil demo: se activa junto con local (--spring.profiles.active=local,demo).
# Agrega los datos semilla de la demostración (un usuario por rol, año escolar 2027 y sus bloques horarios).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/demo

gesedu:
  demo:
    # El año de la semilla es 2027: la demo corre con un reloj que arranca aquí y avanza en tiempo real (RelojDemoConfig).
    # Lunes 15/03/2027 a las 7:40; para el cierre diario (UC-12) usa p. ej. 2027-03-15T15:29:00-05:00.
    reloj-inicio: ${GESEDU_DEMO_RELOJ_INICIO:2027-03-15T07:40:00-05:00}
