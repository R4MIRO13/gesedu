# Perfil aws (Elastic Beanstalk + RDS para PostgreSQL 18). Nada se fija aquí: todo llega por variables de entorno,
# Secrets Manager o Parameter Store. Todavía no se despliega; ver docs/despliegue/aws.md (pendiente).
spring:
  datasource:
    # Ejemplo: jdbc:postgresql://<endpoint-rds>:5432/gesedu?sslmode=verify-full
    url: ${GESEDU_DB_URL}
    username: ${GESEDU_DB_APP_USER}
    password: ${GESEDU_DB_APP_PASSWORD}
  flyway:
    user: ${GESEDU_DB_MIGRATOR_USER}
    password: ${GESEDU_DB_MIGRATOR_PASSWORD}

server:
  port: ${SERVER_PORT:5000}

gesedu:
  # S3 privado para los documentos y SES para el correo (DA-07, docs/PLAN.md § 12)
  archivos:
    tipo: s3
    bucket: ${GESEDU_S3_BUCKET}
    region: ${AWS_REGION}
  notificaciones:
    tipo: ses
    remitente: ${GESEDU_MAIL_FROM}
    region: ${AWS_REGION}
